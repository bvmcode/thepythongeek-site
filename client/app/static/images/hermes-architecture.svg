<text x="760" y="524" text-anchor="middle" class="title white">Public readers</text>
<text x="44" y="478" class="detail">SSM provides administrative access to the agent host.</text>
<text x="44" y="504" class="detail">Private SSH access and public HTTPS are separate paths.</text>
<text x="44" y="530" class="detail">The model runs remotely; the agent and its tools run on EC2.</text>
