<text x="160" y="324" text-anchor="middle" class="title">My Mac</text>
<text x="160" y="348" text-anchor="middle" class="detail">Desktop client · iMessage</text>
<text x="160" y="373" text-anchor="middle" class="detail">Health CSV mirror</text>
<rect x="350" y="270" width="220" height="144" rx="10" fill="#1e4d73"/>
<rect x="367" y="286" width="35" height="3" rx="1.5" fill="#ffe873"/>
<text x="460" y="319" text-anchor="middle" class="title white">Hermes on EC2</text>
<text x="460" y="345" text-anchor="middle" class="detail white">Gateway · scheduler · tools</text>
<text x="460" y="370" text-anchor="middle" class="detail white">SQLite · files · Git clone</text>
<text x="460" y="394" text-anchor="middle" class="detail yellow">Local Ollama relay</text>
<rect x="660" y="292" width="200" height="112" rx="9" fill="#fff" stroke="#cbd7e3"/>
<text x="760" y="324" text-anchor="middle" class="title">Production host</text>
<text x="760" y="348" text-anchor="middle" class="detail">Checkout · deploy.sh</text>
<text x="760" y="373" text-anchor="middle" class="detail">Docker · nginx · Flask</text>
<path d="M350 356 H260" class="line"/><text x="305" y="342" text-anchor="middle" class="small">SSH</text>
<path d="M570 356 H660" class="line"/><text x="615" y="342" text-anchor="middle" class="small">SSH deploy</text>
<path d="M760 493 V404" class="line"/><text x="774" y="469" class="small">HTTPS :443</text>
