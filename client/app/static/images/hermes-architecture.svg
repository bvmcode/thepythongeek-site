<svg xmlns="http://www.w3.org/2000/svg" width="920" height="570" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
<title id="title">Hermes system architecture</title>
<desc id="desc">Telegram, the cloud model API, and GitHub are external services. Hermes runs on EC2 inside a Tailscale network and uses SSH to reach a Mac and a production host. The production host pulls Git content and serves public readers through nginx over HTTPS. SSM provides administration of the agent host.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#306998"/></marker>
  <marker id="yellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#e6cf3a"/></marker>
  <style>text{font-family:Arial,sans-serif;fill:#1a2433}.title{font-size:19px;font-weight:700}.detail{font-size:15px;fill:#42566d}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#306998}.white{fill:#fff}.yellow{fill:#ffe873}.line{stroke:#306998;stroke-width:2;fill:none;marker-end:url(#arrow)}.small{font-size:13px;fill:#42566d}</style>
</defs>
<rect width="920" height="570" rx="12" fill="#f8fafc"/>
<text x="40" y="27" class="label">EXTERNAL SERVICES</text>
<g fill="#fff" stroke="#cbd7e3">
  <rect x="44" y="45" width="190" height="72" rx="8"/>
  <rect x="365" y="45" width="190" height="72" rx="8"/>
  <rect x="686" y="45" width="190" height="72" rx="8"/>
</g>
<text x="139" y="76" text-anchor="middle" class="title">Telegram</text><text x="139" y="99" text-anchor="middle" class="detail">Messaging API</text>
<text x="460" y="76" text-anchor="middle" class="title">Cloud model</text><text x="460" y="99" text-anchor="middle" class="detail">Remote inference</text>
<text x="781" y="76" text-anchor="middle" class="title">GitHub</text><text x="781" y="99" text-anchor="middle" class="detail">Git + pull requests</text>
<rect x="28" y="198" width="864" height="241" rx="12" fill="#eef4f9" stroke="#88a8c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="224" class="label">PRIVATE TAILSCALE NETWORK</text>
<path d="M387 270 V151 H139 V117" class="line"/>
<path d="M460 270 V117" class="line"/>
<path d="M533 270 V151 H781 V117" class="line"/>
